<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>USIA Campus AR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- A-Frame AR Scene (camera + 3D GPS labels) -->
    <a-scene
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
    >
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <!-- UI Layer -->
    <div id="ui">
      <!-- Top bar -->
      <div id="top-bar">
        <span id="app-title">🎓 USIA Navigator</span>
        <button id="emergency-btn">🚨 Emergency</button>
      </div>

      <!-- Destination selector -->
      <div id="dest-panel">
        <label>📍 Go To:</label>
        <select id="place-select">
          <option value="">-- Select Destination --</option>
        </select>
      </div>

      <!-- iOS compass permission button -->
      <button id="orient-btn">🧭 Enable Compass</button>

      <!-- Direction arrow canvas (center of screen) -->
      <canvas id="arrow-canvas"></canvas>

      <!-- Distance / ETA HUD -->
      <div id="hud">
        <div id="dist-label">Select a destination</div>
        <div id="arrived-msg" class="hidden">✅ You have arrived!</div>
      </div>

      <!-- Turn-by-turn steps -->
      <button id="show-steps-btn" class="hidden">🗺️ Steps</button>
      <div id="steps-panel" class="hidden">
        <button id="close-steps">✕</button>
        <div id="steps-title">🗺️ Turn-by-Turn</div>
        <div id="steps-list"></div>
      </div>

      <!-- Info popup -->
      <div id="info-popup" class="hidden">
        <button id="close-popup">✕</button>
        <h2 id="popup-name"></h2>
        <p id="popup-desc"></p>
        <p id="popup-hours"></p>
        <p id="popup-contact"></p>
      </div>

      <!-- GPS status bar -->
      <div id="gps-status">📡 Getting your location...</div>

      <!-- Emergency red flash border -->
      <div id="emergency-overlay"></div>
    </div>

    <script src="locations.js"></script>
    <script src="navigation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
